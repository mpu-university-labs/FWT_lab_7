<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Калькулятор">
    <h1>Калькулятор</h1>
    <output class="screen" aria-live="polite">0</output>
    <div class="buttons">
      <button class="clear" type="button">C</button>
      <button class="bracket" type="button">(</button>
      <button class="bracket" type="button">)</button>
      <button class="operation" type="button">÷</button>

      <button class="digit" type="button">7</button>
      <button class="digit" type="button">8</button>
      <button class="digit" type="button">9</button>
      <button class="operation" type="button">×</button>

      <button class="digit" type="button">4</button>
      <button class="digit" type="button">5</button>
      <button class="digit" type="button">6</button>
      <button class="operation" type="button">−</button>

      <button class="digit" type="button">1</button>
      <button class="digit" type="button">2</button>
      <button class="digit" type="button">3</button>
      <button class="operation" type="button">+</button>

      <button class="digit zero" type="button">0</button>
      <button class="digit" type="button">.</button>
      <button class="result" type="button">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
